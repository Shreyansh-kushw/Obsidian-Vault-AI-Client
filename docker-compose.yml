services:
  # Python Client Daemon (Watchdog, Sync Engine, Local REST & WebSocket API)
  client-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: obsidian-vault-client-backend
    ports:
      - "5050:5050"
    environment:
      - SERVER_URL=${SERVER_URL:-http://host.docker.internal:8000}
      - API_KEY=${API_KEY}
      - OWNER_TOKEN=${OWNER_TOKEN}
      - CLIENT_PORT=5050
      - CLIENT_HOST=0.0.0.0
      - DEBOUNCE_SECONDS=${DEBOUNCE_SECONDS:-1.0}
      - POLL_INTERVAL=${POLL_INTERVAL:-5.0}
    extra_hosts:
      # Allows reaching server running on the host machine (http://host.docker.internal:8000)
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount local configuration for persistence
      - ./client_config.json:/app/client_config.json
      # Mount host directory containing Obsidian vaults (configurable via .env)
      - ${LOCAL_VAULTS_DIR:-./vaults}:/vaults

    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5050/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # React + Vite UI Dashboard (Served via Nginx)
  client-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_CLIENT_API_URL=${VITE_CLIENT_API_URL:-http://localhost:5050}
        - VITE_CLIENT_WS_URL=${VITE_CLIENT_WS_URL:-ws://localhost:5050/ws}
    container_name: obsidian-vault-client-frontend
    ports:
      - "5173:80"
    depends_on:
      client-backend:
        condition: service_healthy
    restart: unless-stopped
